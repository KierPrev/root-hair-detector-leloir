name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller tifffile

      - name: Build executable
        run: pyinstaller --onefile --name hair-detection --add-data "src/parametros_deteccion.json;." src/root_hairs.py

      - name: Armar paquete para probar en Windows
        run: Copy-Item dist\hair-detection.exe windows_release\hair-detection.exe

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: hair-detection-windows
          path: windows_release/
